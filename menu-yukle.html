<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menü yükle</title><link rel="stylesheet" href="style.css">
<div id="gate" class="wrap"><h1>Menü yükleme</h1><button id="gbtn">Google ile giriş yap</button><p id="msg"></p></div>
<div id="app" hidden><header><h1>Menü yükleme</h1><button id="out">Çıkış</button></header><main class="wrap"><p>Nula Coffee menüsünü tek seferde yükler. Aynı işlemi tekrar çalıştırırsan ürünler çoğalmaz, üzerine yazılır.</p><button id="go">Menüyü yükle</button><p id="res"></p></main></div>
<script type="module">
import{db,fs as F,$,gate}from"./config.js";
const M=[
["Kahveler","Dünya Kahveleri","Americano:130|Espresso:90|Affogato:170|Double Espresso:130|Cortado:150|Cappuccino:170|Caramel Macchiato:170|Latte Macchiato:170|Flat White:170|Cafe Latte:170|Caramel Latte:170|White Chocolate Mocha:170|Mocha:170|Toffeenut Latte:170|Vanilyalı Latte:170|Fındık Latte:170|Filtre Kahve:150"],
["Kahveler","Soğuk Kahveler","Ice Americano:130|Ice Cafe Latte:160|Ice Caramel Latte:170|Ice White Mocha:170|Ice Mocha:170|Ice Toffenut Latte:170|Ice Vanilyalı Latte:170|Ice Strawberry Latte:170|Fıstıklı Latte:230|Fıstıklı Ice Latte:250"],
["Soğuk İçecekler","Milkshake","Çilekli Milkshake:180|Çikolatalı Milkshake:180|Muz Milkshake:180|Oreo Milkshake:180|Karamel Milkshake:180|Vanilyalı Milkshake:180"],
["Soğuk İçecekler","Frozen","Ananas Frozen:170|Mango Frozen:170|Orman Meyveli Frozen:170|Kavun Frozen:170|Karpuz Frozen:170|Çilek Frozen:170|Nula Special Frozen:190"],
["Soğuk İçecekler","Kokteyl","Cosmopolitan:180|Pinacolada:180|Cindy:180|El Matador:180|Black Power:180|Bısmıl Kokteyl:180|Karışık Kokteyl:180|Mojito:170|Çilekli Mojito:180|Elmalı Mojito:180|Cool Lime:170|Berry Hibiskus:180|İtalyan Soda:160|Special:200"],
["Soğuk İçecekler","Su, soda ve limonata","Su:25|Sade Soda:60|Limonlu Soda:80|Churchill:100|Redbull:100|Limonata:130|Çilekli Limonata:140|Elmalı Limonata:140"],
["Sıcak İçecekler","Çikolata ve salep","Sıcak Çikolata:130|Beyaz Sıcak Çikolata:130|Salep:130|Karamelli Salep:130|Çikolatalı Salep:130"],
["Sıcak İçecekler","Çaylar","Çay:25|Ihlamur Çayı:100|Ada Çayı:100"],
["Waffle","Waffle","Kova Waffle:220|Kova Waffle + Limonata:320|Double Kova Waffle:400|Double Kova Waffle + 2 Limonata:600|Bardak Waffle:180"]];
gate(["admin"],()=>{$("#go").onclick=async()=>{const ops=[];let ci=0,pi=0;
 for(const[g,t,s]of M){const id="c"+ci++;ops.push([F.doc(db,"categories",id),{g,n:t,active:true}]);
  for(const x of s.split("|")){const[name,p]=x.split(":");ops.push([F.doc(db,"products",id+"p"+String(pi++).padStart(3,"0")),{cat:id,name,price:+p,desc:"",active:true}])}}
 $("#res").textContent="Yükleniyor...";
 try{for(let i=0;i<ops.length;i+=8){const b=F.writeBatch(db);ops.slice(i,i+8).forEach(([r,d])=>b.set(r,d));await b.commit()}
  await F.setDoc(F.doc(db,"settings","main"),{name:"Nula Coffee"},{merge:true});
  $("#res").textContent=`Yüklendi: ${ci} kategori, ${pi} ürün. Bu dosyayı GitHub'dan silebilirsin.`}
 catch(err){$("#res").textContent="Hata: "+err.message}}});
</script>
