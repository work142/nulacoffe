<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kafe</title><link rel="stylesheet" href="style.css"><style>#closed{background:var(--card);border:1px solid var(--accent);border-radius:14px;padding:14px 16px;margin:6px 0 10px;text-align:center}#closed small{display:block;color:var(--mute);margin-top:4px}.tile{overflow:hidden;width:72px;height:72px}.tile img{width:100%;height:100%;object-fit:cover}.so{color:var(--mute);font-size:.85rem;border:1px solid var(--line);border-radius:10px;padding:8px 12px;white-space:nowrap}</style>
<div id="camp"></div>
<main class="wrap menu"><div class="brand"><h1 id="nm"></h1><p>İyi kahve, güzel insanlar, nice sohbetler.</p><small>Siparişiniz adresinize getirilir, ödeme kapıda.</small></div><div id="closed" hidden></div><div id="trk"></div><nav id="ct"></nav><div id="pl"></div></main>
<button id="cb" hidden>Sepeti gör <b id="cn">0</b></button>
<aside id="cart" hidden><div class="sheet"><div class="row"><h2>Sepetim</h2><button id="cx">Kapat</button></div><div id="items"></div><div id="tot"></div>
<form id="f"><input name="name" placeholder="Ad soyad" required><input name="phone" type="tel" placeholder="Telefon (05xx xxx xx xx)" pattern="[0-9 +]{10,15}" required><textarea name="addr" placeholder="Açık adres" required></textarea><textarea name="note" placeholder="Sipariş notu (isteğe bağlı)"></textarea><p>Ödeme kapıda: nakit veya kart.</p><button id="sb" style="width:100%">Siparişi ver</button></form></div></aside>
<script type="module">
import{db,fs as F,$,e,today,applyTheme,getSettings}from"./config.js";
let S,cats=[],prods=[],camps=[],cart={},g="",c="",un;
const TL=n=>"₺"+(+n).toLocaleString("tr-TR");
let edit=0,cur,closed=0;const HOLD=6e4;
const nowTR=()=>{const p=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:"Europe/Istanbul",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).map(x=>[x.type,x.value]));return{d:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday),m:+p.hour*60+ +p.minute}};
const isOpen=(h,n=nowTR())=>{if(!h)return true;const mn=s=>{const[a,b]=s.split(":");return +a*60+ +b},t=h[n.d],y=h[(n.d+6)%7],ok=x=>x&&!x.x&&x.o&&x.c;
 if(ok(t)){const o=mn(t.o),c=mn(t.c);if(c>o?n.m>=o&&n.m<c:n.m>=o)return true}
 if(ok(y)){const o=mn(y.o),c=mn(y.c);if(c<=o&&n.m<c)return true}
 return false};
function bar(){const b=$("#closed"),t=S.hours?.[nowTR().d];b.hidden=!closed;if(closed)b.innerHTML="Cafemiz şu an kapalıdır, ancak açılınca ne isteyeceğinizi seçmek için menümüze bakabilirsiniz."+(t&&!t.x&&t.o&&t.c?`<small>Bugünkü çalışma saatlerimiz: ${e(t.o)} - ${e(t.c)}</small>`:"")}
setInterval(()=>{if(!S)return;const c=!isOpen(S.hours);if(c!=closed){closed=c;bar();draw()}},30000);
const col=n=>F.getDocs(F.collection(db,n)).then(s=>s.docs.map(d=>({id:d.id,...d.data()})));
const ico=x=>{const t=x.n.toLocaleLowerCase("tr");return([[/waffle/,"🧇"],[/kokteyl|mojito/,"🍹"],[/milkshake/,"🥤"],[/frozen/,"🧊"],[/limonata|soda/,"🍋"],[/çay|sıcak/,"🍵"],[/soğuk içecek/,"🥤"],[/çikolata|salep/,"🍫"],[/tatlı|pasta|kek|kubbe|cheesecake/,"🍰"]].find(([r])=>r.test(t))||[0,"☕"])[1]};
function draw(){const cs=cats.filter(x=>prods.some(p=>p.cat==x.id));
 $("#ct").innerHTML=cs.map(x=>`<button class="chip" data-s="${x.id}">${e(x.n)}</button>`).join("");
 $("#pl").innerHTML=cs.map(x=>`<section id="s-${x.id}"><h2>${e(x.n)}</h2>`+prods.filter(p=>p.cat==x.id).map(p=>`<div class="item"><div class="tile">${p.img?`<img src="${e(p.img)}" alt="" loading="lazy">`:ico(x)}</div><div class="info"><h3>${e(p.name)}</h3><p>${e(p.desc)}</p><b>${TL(p.price)}</b></div>${closed?"":p.out||p.active===false?'<span class="so">Tükendi</span>':`<button data-a="${p.id}">Ekle</button>`}</div>`).join("")+"</section>").join("")||"<p>Menü yakında burada olacak.</p>";
 const nav=$("#ct"),bs=[...nav.children];bs[0]?.classList.add("on");
 const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){const id=x.target.id.slice(2);bs.forEach(b=>{const on=b.dataset.s==id;b.classList.toggle("on",on);if(on)nav.scrollLeft=b.offsetLeft-(nav.clientWidth-b.offsetWidth)/2})}}),{rootMargin:"-70px 0px -80% 0px"});
 document.querySelectorAll("#pl section").forEach(x=>io.observe(x))}
function calc(){const it=Object.entries(cart).map(([i,q])=>({p:prods.find(x=>x.id==i),q})).filter(x=>x.p&&!x.p.out&&x.p.active!==false),sub=it.reduce((a,x)=>a+x.p.price*x.q,0),
 best=camps.filter(x=>sub>=(x.min||0)).sort((a,b)=>b.pct-a.pct)[0],disc=best?Math.round(sub*best.pct)/100:0;
 return{it,sub,best,disc,total:sub-disc}}
function sum(){const r=calc();const n=r.it.reduce((a,x)=>a+x.q,0);$("#cn").textContent=n;$("#cb").hidden=!n;
 $("#items").innerHTML=r.it.map(x=>`<div class="row"><span>${e(x.p.name)}</span><span><button data-m="${x.p.id}:-1">−</button> ${x.q} <button data-m="${x.p.id}:1">+</button> ${TL(x.p.price*x.q)}</span></div>`).join("")||"<p>Sepetin boş. Menüden ürün ekle.</p>";
 $("#tot").innerHTML=`<div class="row"><span>Ara toplam</span>${TL(r.sub)}</div>`+(r.disc?`<div class="row"><span>${e(r.best.title)}</span>−${TL(r.disc)}</div>`:"")+`<div class="row"><b>Toplam</b><b>${TL(r.total)}</b></div>`}
function paint(){const o=cur,L=["Alındı","Hazırlanıyor","Yolda","Teslim edildi"],i=Math.max(0,["new","prep","way","done"].indexOf(o.status)),x=o.status=="cancelled",dn=o.status=="done",left=HOLD-(Date.now()-(+localStorage.ot||0)),h=o.status=="hold"&&left>0;
 if(!h&&edit){edit=0;$("#sb").textContent="Siparişi ver"}
 $("#trk").innerHTML=`<div class="card"><b>${x?"Siparişiniz iptal edildi":"Siparişinizin durumu: "+L[i]}</b>`+(x||dn?"":"<p>Siparişiniz alındı. Durumunu sayfanın üst kısmından takip edebilirsiniz.</p>")+(h?`<p>Siparişiniz <b id="cd">${Math.ceil(left/1000)}</b> saniye içinde kasaya iletilecek. Bu sürede düzenleyebilir veya iptal edebilirsiniz.</p><div class="row"><button data-ed="1">Siparişi düzenle</button><button data-oc="1" style="background:none;border:1px solid var(--line);color:var(--ink)">İptal et</button></div>`:"")+(x?"":`<div class="steps">${L.map((l,k)=>`<span class="${k<=i?"on":""}">${l}</span>`).join("")}</div>`)+(x||dn?'<button id="x">Kapat</button>':"")+"</div>"}
function track(){const id=localStorage.oid;if(!id)return;un&&un();
 un=F.onSnapshot(F.doc(db,"orders",id),s=>{cur=s.data();if(!cur){$("#trk").innerHTML="";return}paint()},()=>{})}
setInterval(()=>{if(!cur)return;const el=$("#cd"),l=HOLD-(Date.now()-(+localStorage.ot||0));if(el&&l>0)el.textContent=Math.ceil(l/1000);else if(el)paint()},1000);
(async()=>{S=await getSettings();const T=S.theme.n?{bg:"#11201a",card:"#1b2c25",ink:"#f3efe6",accent:"#c9a45c"}:S.theme;applyTheme(T);document.title=S.name;$("#nm").textContent=(S.theme.n||!T.emoji?"":T.emoji+" ")+S.name;
 [cats,prods,camps]=await Promise.all([col("categories"),col("products"),col("campaigns")]);
 camps=camps.filter(x=>x.active);
 $("#camp").innerHTML=camps.map(x=>`<div class="ban">${e(x.title)}: %${x.pct} indirim</div>`).join("");
 g=cats[0]?.g||"";closed=!isOpen(S.hours);bar();draw();sum();track()})();
document.onclick=ev=>{const t=ev.target,d=t.dataset;
 if(d.s)document.getElementById("s-"+d.s).scrollIntoView({behavior:"smooth"});
 else if(d.a){cart[d.a]=(cart[d.a]||0)+1;sum()}
 else if(d.m){const[i,n]=d.m.split(":");cart[i]=(cart[i]||0)+ +n;if(cart[i]<1)delete cart[i];sum()}
 else if(d.ed){const f=$("#f");for(const k of["name","phone","addr","note"])f.elements[k].value=cur[k]||"";cart={};cur.items.forEach(y=>{if(y.id)cart[y.id]=y.q});edit=1;$("#sb").textContent="Siparişi güncelle";sum();$("#cart").hidden=false}
 else if(d.oc){if(confirm("Siparişiniz iptal edilsin mi?"))F.updateDoc(F.doc(db,"orders",localStorage.oid),{status:"cancelled"})}
 else if(t.id=="x"){localStorage.removeItem("oid");un&&un();cur=0;$("#trk").innerHTML=""}};
$("#cb").onclick=()=>$("#cart").hidden=false;$("#cx").onclick=()=>$("#cart").hidden=true;$("#f").onchange=sum;
let busy=0;
$("#f").onsubmit=async ev=>{ev.preventDefault();if(busy)return;if(!edit&&!isOpen(S.hours)){closed=1;bar();draw();return alert("Cafemiz şu an kapalıdır, ancak açılınca sipariş verebilirsiniz.")}const r=calc();if(!r.it.length)return alert("Sepetin boş.");
 const f=ev.target,sb=$("#sb"),d=Object.fromEntries(new FormData(f)),o={name:d.name,phone:d.phone,addr:d.addr,note:d.note,items:r.it.map(x=>({id:x.p.id,n:x.p.name,q:x.q,p:x.p.price})),sub:r.sub,disc:r.disc,camp:r.best?.title||"",total:r.total};
 busy=1;sb.disabled=true;sb.style.opacity=.6;sb.textContent="Gönderiliyor, lütfen bekleyin...";
 const tm=setTimeout(()=>sb.textContent="Bağlantı yavaş, tekrar basmadan bekleyin...",8000);
 try{
  if(edit){if(Date.now()-(+localStorage.ot||0)>HOLD){edit=0;return alert("Düzenleme süresi doldu, siparişiniz kasaya iletildi.")}
   await F.updateDoc(F.doc(db,"orders",localStorage.oid),o);edit=0}
  else{const ref=await F.addDoc(F.collection(db,"orders"),{...o,status:"hold",day:today(),at:F.serverTimestamp()});localStorage.oid=ref.id;localStorage.ot=Date.now();track()}
  cart={};f.reset();sum();$("#cart").hidden=true;scrollTo(0,0)}
 catch(err){alert(edit?"Düzenleme süresi doldu, siparişiniz kasaya iletildi.":"Sipariş gönderilemedi, lütfen tekrar deneyin. ("+(err.code||err.message)+")");edit=0}
 finally{clearTimeout(tm);busy=0;sb.disabled=false;sb.style.opacity="";sb.textContent=edit?"Siparişi güncelle":"Siparişi ver"}};
</script>
