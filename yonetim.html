<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yönetim</title><link rel="stylesheet" href="style.css">
<div id="gate" class="wrap"><h1>Yönetim girişi</h1><button id="gbtn">Google ile giriş yap</button><p id="msg"></p></div>
<div id="app" hidden><header><h1>Yönetim</h1><span><a href="kasa" style="color:#fff">Kasa</a> <button id="out">Çıkış</button></span></header><main class="wrap">
<details open><summary>Menü</summary><h3>Kategori ekle</h3>
<form class="f" data-add="categories"><input name="g" list="gl" placeholder="Grup (Tatlılar, Soğuk içecekler)" required><datalist id="gl"></datalist><input name="n" placeholder="Tür (Cheesecake, Limonata)" required><button>Kategori ekle</button></form><ul id="cl"></ul>
<h3>Ürün ekle</h3><form class="f" data-add="products"><select name="cat" id="pc" required></select><input name="name" placeholder="Ürün adı" required><input name="price" type="number" step="any" placeholder="Fiyat (₺)" required><input name="desc" placeholder="Açıklama"><button>Ürün ekle</button></form><ul id="pl"></ul></details>
<details><summary>Kampanyalar</summary><form class="f" data-add="campaigns"><input name="title" placeholder="Kampanya adı" required><input name="pct" type="number" placeholder="İndirim yüzdesi" required><input name="min" type="number" value="0" placeholder="Minimum sepet (₺)"><button>Kampanya ekle</button></form><ul id="kl"></ul></details>
<details><summary>Tema</summary><div id="pr"></div><form class="f" id="th" data-set="theme"><input name="name" placeholder="Kafe adı"><input name="emoji" placeholder="Başlık simgesi"><label>Arka plan<input type="color" name="bg"></label><label>Kart<input type="color" name="card"></label><label>Yazı<input type="color" name="ink"></label><label>Vurgu<input type="color" name="accent"></label><button>Temayı kaydet</button></form></details>
<details><summary>Personel</summary><form class="f" data-add="staff"><input name="email" type="email" placeholder="Google e-postası" required><select name="role"><option value="kasa">Kasa</option><option value="admin">Yönetici</option></select><button>Personel ekle</button></form><ul id="sl"></ul></details>
</main></div>
<script type="module">
import{db,fs as F,$,e,TL,THEMES,applyTheme,getSettings,gate}from"./config.js";
const OWNER="nulacoffe1@gmail.com";
const C=n=>F.collection(db,n),D=(n,i)=>F.doc(db,n,i),M={merge:true};
const live=(n,f)=>F.onSnapshot(C(n),s=>f(s.docs.map(d=>({id:d.id,...d.data()}))));
const fill=(f,o)=>{for(const k in o)if(f.elements[k])f.elements[k].value=o[k]};
const btn=(c,x,v,t)=>`<button data-tg="${c}:${x}:${v}">${t}</button> <button data-del="${c}:${x}">Sil</button>`;
gate(["admin"],async()=>{const S=await getSettings();
 fill($("#th"),{...S.theme,name:S.name});
 $("#th").oninput=()=>applyTheme(Object.fromEntries(new FormData($("#th"))));
 $("#pr").innerHTML=Object.entries(THEMES).map(([k,t])=>`<button data-p="${k}">${t.emoji} ${t.n}</button> `).join("");
 live("categories",l=>{$("#cl").innerHTML=l.map(x=>`<li>${e(x.g)} › ${e(x.n)} <button data-del="categories:${x.id}">Sil</button></li>`).join("");
  $("#pc").innerHTML=l.map(x=>`<option value="${x.id}">${e(x.g)} › ${e(x.n)}</option>`).join("");
  $("#gl").innerHTML=[...new Set(l.map(x=>x.g))].map(x=>`<option value="${e(x)}">`).join("")});
 live("products",l=>$("#pl").innerHTML=l.map(p=>`<li>${e(p.name)}, ${TL(p.price)} ${btn("products",p.id,p.active===false,p.active===false?"Pasif (aç)":"Aktif (kapat)")}</li>`).join(""));
 live("campaigns",l=>$("#kl").innerHTML=l.map(x=>`<li>${e(x.title)}, %${x.pct} ${btn("campaigns",x.id,!x.active,x.active?"Açık (kapat)":"Kapalı (aç)")}</li>`).join(""));
 live("staff",l=>$("#sl").innerHTML=l.map(x=>`<li>${e(x.id)}, ${x.role} ${x.id==OWNER?"(baş yönetici)":`<button data-del="staff:${x.id}">Sil</button>`}</li>`).join(""))});
document.onsubmit=async ev=>{ev.preventDefault();const f=ev.target,d=Object.fromEntries(new FormData(f)),a=f.dataset.add,s=f.dataset.set;
 for(const k in d)if(f.elements[k].type=="number")d[k]=+d[k];
 if(a=="staff"&&d.email.toLowerCase()==OWNER)return alert("Baş yönetici değiştirilemez.");
 if(a=="staff")await F.setDoc(D("staff",d.email.toLowerCase()),{role:d.role});
 else if(a)await F.addDoc(C(a),{...d,active:true});
 else if(s=="theme"){const{name,...t}=d;await F.setDoc(D("settings","main"),{name,theme:t},M)}
 a?f.reset():alert("Kaydedildi")};
document.onclick=ev=>{const t=ev.target.dataset;
 if(t.p){fill($("#th"),THEMES[t.p]);applyTheme(THEMES[t.p])}
 if(t.del&&t.del!="staff:"+OWNER&&confirm("Silinsin mi?")){const[c,i]=t.del.split(":");F.deleteDoc(D(c,i))}
 if(t.tg){const[c,i,v]=t.tg.split(":");F.updateDoc(D(c,i),{active:v=="true"})}};
</script>
